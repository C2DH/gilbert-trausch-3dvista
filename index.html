/* Styles for vanilla JS lightbox */
.vanilla-lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.vanilla-lightbox.active {
  opacity: 1;
  pointer-events: auto;
}

.lightbox-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  max-width: 90%;
  max-height: 90%;
}

.lightbox-content {
  position: relative;
  background-color: #fff;
  border-radius: 5px;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
  transition: width 0.3s ease, height 0.3s ease;
}

.lightbox-loading {
  padding: 20px;
  text-align: center;
  color: #333;
}

.lightbox-close-button {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;

  border-radius: 50%;
  background-color: #fff;

  display: flex;
  justify-content: center;
  align-items: center;
  line-height: 1;
}

.lightbox-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
